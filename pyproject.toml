[project]
name = "htmlreview"
version = "0.1.0"
description = "Local tool to review, edit and comment on HTML reports, then publish clean HTML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
htmlreview = "htmlreview.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
